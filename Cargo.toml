[package]
name = "parser"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Marcelo Trylesinski <marcelotryle@gmail.com>"]

[lib]
name = "parser"
crate-type = ["cdylib"]

[dependencies]
memchr = "2.8.3"
pyo3 = { version = "0.29.2", features = ["abi3-py310", "extension-module"] }

[profile.release]
lto = true
codegen-units = 1
